<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Mission Control</title>
  <link rel="stylesheet" href="style.css" />
  
</head>
<body>

<script src="/_sdk/element_sdk.js"></script>

  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="https://cdn.tailwindcss.com" type="text/javascript"></script>

  <main class="control-panel">
   <h1 class="mission-title">Space Mission Control</h1>
   <div class="warning-lights">
    <div class="warning-light"></div>
    <div class="warning-light"></div>
    <div class="warning-light"></div>
   </div>
   <div class="countdown-label">
    Mission Failsafe Countdown
   </div>
   <div class="countdown-display" id="countdown">
    30:00
   </div>
   <div class="password-section"><label for="password" class="password-label">Emergency Password</label> <input type="text" id="password" class="password-input" placeholder="Enter emergency code..." autocomplete="off"> <button class="submit-button" id="submitBtn">Stabilize Spacecraft</button>
   </div>
   <div class="status-message" id="statusMessage"></div>
  </main>
  <!-- <div class="confirmation-overlay" id="confirmationOverlay">
   <div class="confirmation-dialog">
    <h3>Mission Control Warning</h3>
    <p>Are you sure you want to refresh? This will abort the current mission!</p>
    <div class="confirmation-buttons"><button class="confirm-btn" id="confirmRefresh">Yes, Refresh</button> <button class="cancel-btn" id="cancelRefresh">Cancel</button>
    </div>
   </div> -->
  </div>
  <div class="crash-animation" id="crashAnimation">
   <div class="spacecraft">
    🚀
   </div>
   <div class="explosion">
    💥
   </div>
   <div class="debris">
    ⚡
   </div>
   <div class="debris">
    🔥
   </div>
   <div class="debris">
    💨
   </div>
   <div class="debris">
    ⭐
   </div>
   <div class="crash-text">
    Spacecraft Destroyed
   </div>
  </div>
 
   <script src="script.js"></script>
</body>
</html>
